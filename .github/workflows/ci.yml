name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # Need a real broker (with websockets) for tests
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
